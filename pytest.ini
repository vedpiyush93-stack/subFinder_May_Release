[pytest]
# The test files are named for what they assert rather than with a test_ prefix
# (leak_audit.py, verify_input_formats_agree.py, ...), so pytest's default
# discovery pattern misses them and `pytest tests/` collects nothing. Widen it.
python_files = test_*.py *_audit.py verify_*.py
testpaths = tests
addopts = -q
